<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모두의 뇌 기획 시각화</title>
    <style>
      :root {
        color: #1d1d1f;
        background: #f5f5f7;
        font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f5f7;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }

      header {
        padding-bottom: 32px;
        border-bottom: 1px solid #d2d2d7;
      }

      h1 {
        margin: 0;
        font-size: 52px;
        font-weight: 600;
        line-height: 1.07;
        letter-spacing: -0.28px;
      }

      p {
        max-width: 780px;
        margin: 18px 0 0;
        color: #6e6e73;
        font-size: 19px;
        line-height: 1.55;
      }

      .visual {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 36px;
        border: 1px solid #d2d2d7;
        border-radius: 28px;
        background: #ffffff;
      }

      .notes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .note {
        padding: 22px;
        border: 1px solid #d2d2d7;
        border-radius: 18px;
        background: #ffffff;
      }

      .note strong {
        display: block;
        margin-bottom: 8px;
        font-size: 18px;
        line-height: 1.3;
      }

      .note span {
        display: block;
        color: #6e6e73;
        font-size: 15px;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        h1 {
          font-size: 40px;
        }

        .notes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>모두의 뇌</h1>
        <p>
          여러 분야가 함께 움직이는 프로젝트에서 흩어진 맥락을 연결해,
          팀 전체가 같은 배경지식 위에서 협업하도록 돕는 AI 에이전트 기획입니다.
        </p>
      </header>

      <img class="visual" src="images/modu-brain-cover.png" alt="모두의 뇌 기획 대표 이미지" />

      <section class="notes" aria-label="핵심 요약">
        <div class="note">
          <strong>문제</strong>
          <span>서로 다른 전공과 역할이 같은 회의를 해도 배경 맥락을 다르게 이해합니다.</span>
        </div>
        <div class="note">
          <strong>AI 역할</strong>
          <span>주제, 용어, 결정 배경, 관점 차이, 미결 질문을 추출합니다.</span>
        </div>
        <div class="note">
          <strong>결과</strong>
          <span>공유 지식맵과 온보딩 요약으로 반복 설명과 재작업을 줄입니다.</span>
        </div>
      </section>
    </main>
  </body>
</html>
